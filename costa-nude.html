<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Costa Nude — Costa Cases</title>
<meta name="description" content="Costa Nude phone case by Costa Cases.">
<style>
:root{--cream:#f8f4ef;--ink:#191715;--muted:#746d66;--accent:#c98f83;--line:#e6ded6;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream)}
a{color:inherit;text-decoration:none}button,select{font:inherit;cursor:pointer}
.nav{position:sticky;top:0;z-index:20;background:rgba(248,244,239,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1180px;margin:auto;padding:14px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative}
.logo{font-weight:800;letter-spacing:.14em;font-size:18px;justify-self:start}
.brand-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;object-fit:contain}
.links{display:flex;gap:28px;font-size:14px;justify-self:center}.links a:hover{opacity:.55}
.cart{border:1px solid var(--ink);border-radius:999px;padding:9px 14px;background:transparent;justify-self:end}.count{display:inline-block;min-width:18px}
.hero{max-width:1180px;margin:auto;padding:78px 24px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--muted)}h1{font-size:clamp(50px,8vw,92px);line-height:.9;margin:18px 0 24px;letter-spacing:-.06em}h2{font-size:38px;letter-spacing:-.04em;margin:0 0 10px}
.hero p{max-width:500px;color:var(--muted);line-height:1.7;font-size:17px}
.cta{display:inline-block;background:var(--ink);color:white;padding:15px 23px;border-radius:999px;margin-top:12px;font-size:14px;font-weight:700}.cta:hover{transform:translateY(-1px)}
.hero-art{min-height:470px;border-radius:34px;background:linear-gradient(145deg,#d9b2a8,#b77d72);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 25px 60px rgba(60,40,30,.12)}
.phone{width:210px;height:390px;border:9px solid #171513;border-radius:35px;background:linear-gradient(135deg,#f3d9d1,#fff4ee);transform:rotate(-9deg);box-shadow:20px 25px 40px rgba(0,0,0,.25);position:relative}.phone:before{content:"C";position:absolute;inset:0;display:grid;place-items:center;font-size:100px;font-weight:800;color:rgba(25,23,21,.12)}.camera{position:absolute;top:18px;left:18px;width:55px;height:55px;background:#181615;border-radius:16px}.camera:after{content:"";position:absolute;inset:12px;border:4px solid #aaa;border-radius:50%}
.section{max-width:1180px;margin:auto;padding:72px 24px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.sub{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;overflow:hidden}.product-link{display:block}.product-link:hover .product-img{transform:scale(1.015)}.product-img{height:330px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s}.p1{background:#eee6df}.p2{background:#ead8d0}.p3{background:#ddd9d0}.case{width:135px;height:250px;border:7px solid #222;border-radius:25px;box-shadow:12px 16px 25px rgba(0,0,0,.18);position:relative}.case:before{content:"";position:absolute;inset:0;border-radius:18px;background:var(--case,#eee)}.case:after{content:"";position:absolute;top:14px;left:14px;width:35px;height:35px;border-radius:10px;background:#222}.card-body{padding:18px}.name{font-weight:700}.price{color:var(--muted);margin:7px 0 15px}.add{width:100%;padding:11px;border:1px solid var(--ink);background:transparent;border-radius:999px}.add:hover{background:var(--ink);color:white}
.about{background:#eee7df}.about-inner{max-width:800px;margin:auto;text-align:center}.about p{font-size:18px;color:var(--muted);line-height:1.8}
.newsletter{background:var(--ink);color:white;text-align:center}.newsletter .sub{color:#c9c1bb}.form{display:flex;max-width:520px;margin:24px auto 0}.form input{flex:1;padding:15px 17px;border:0;border-radius:999px 0 0 999px}.form button{padding:15px 22px;border:0;background:var(--accent);border-radius:0 999px 999px 0}
footer{max-width:1180px;margin:auto;padding:30px 24px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.instagram-link:hover{color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:999px;transition:.25s;z-index:30}.toast.show{transform:translateX(-50%) translateY(0)}
.product-page{max-width:1050px;margin:auto;padding:70px 24px}.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.product-visual{min-height:600px;border-radius:30px;display:flex;align-items:center;justify-content:center}.product-visual .case{width:190px;height:350px;border-width:9px}.product-info h1{font-size:clamp(48px,6vw,76px);margin:12px 0}.product-price{font-size:20px;margin:18px 0}.product-description{color:var(--muted);line-height:1.8;max-width:470px}.option-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:block;margin:28px 0 9px}.model-select{width:100%;max-width:360px;padding:13px 14px;border:1px solid var(--line);border-radius:999px;background:white}.product-add{display:block;max-width:360px;width:100%;margin-top:18px;padding:15px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700}.back{display:inline-block;margin-bottom:35px;color:var(--muted);font-size:14px}.back:hover{color:var(--ink)}
@media(max-width:750px){.links{display:none}.nav-inner{padding:14px 18px}.brand-mark{width:36px;height:36px}.hero{grid-template-columns:1fr;padding-top:52px}.hero-art{min-height:390px}.grid{grid-template-columns:1fr 1fr}.product-img{height:250px}.section{padding:55px 18px}.form{padding:0 15px}footer{flex-direction:column;gap:10px}.product-layout{grid-template-columns:1fr;gap:35px}.product-visual{min-height:440px}.product-page{padding:45px 18px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.product-img{height:310px}h1{font-size:58px}.logo{font-size:14px}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
<a class="logo" href="index.html">COSTA CASES</a>
<img class="brand-mark" src="costa-logo.png" alt="Costa Cases logo">
<div class="links"><a href="index.html#shop">Shop</a><a href="index.html#about">About</a><a href="index.html#faq">FAQ</a></div>
<button class="cart" onclick="showCart()">Bag (<span class="count" id="count">0</span>)</button>
</div></nav>
<main class="product-page">
<a class="back" href="index.html#shop">← Back to shop</a>
<div class="product-layout">
<div class="product-visual" style="background:#ead8d0"><div class="case" style="--case:#d8b4aa"></div></div>
<div class="product-info">
<div class="eyebrow">COSTA CASES</div>
<h1>Costa Nude</h1>
<div class="product-price">$24.00</div>
<p class="product-description">A warm neutral case designed to go with everything. Built to keep your phone protected while still feeling like part of your style.</p>
<label class="option-label" for="model">Choose your iPhone model</label>
<select class="model-select" id="model">
<option>iPhone 15</option><option>iPhone 15 Pro</option><option>iPhone 15 Pro Max</option>
<option>iPhone 16</option><option>iPhone 16 Pro</option><option>iPhone 16 Pro Max</option>
<option>iPhone 17</option><option>iPhone 17 Pro</option><option>iPhone 17 Pro Max</option>
</select>
<button class="product-add" onclick="add('Costa Nude', document.getElementById('model').value)">Add Costa Nude to bag</button>
</div>
</div>
</main>
<footer><div>© 2026 Costa Cases</div><div><a class="instagram-link" href="https://www.instagram.com/c.ostacases?stkn=MWxvMTl0NGtka2I4aQ%3D%3D" target="_blank" rel="noopener">Instagram</a> • TikTok • Email</div></footer>
<div class="toast" id="toast"></div>
<script>
let count = Number(localStorage.getItem('costaBagCount') || 0);
let items = JSON.parse(localStorage.getItem('costaBagItems') || '[]');
document.querySelectorAll('#count').forEach(el => el.textContent = count);
function syncBag(){
  localStorage.setItem('costaBagCount', count);
  localStorage.setItem('costaBagItems', JSON.stringify(items));
  document.querySelectorAll('#count').forEach(el => el.textContent = count);
}
function add(name, model=''){
  count++;
  items.push(model ? `${name} — ${model}` : name);
  syncBag();
  toast(name + ' added to your bag');
}
function showCart(){
  if(!count){toast('Your bag is empty');return}
  toast(count+' item'+(count===1?'':'s')+' in your bag');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200)
}
function subscribe(e){
  e.preventDefault();toast('Thanks for joining Costa Cases!');e.target.reset();
}
</script>
</body></html>
